name: Auto Update Whitelist Bypass

on:
  schedule:
    - cron: '0 */5 * * *' # Каждые 5 часов
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Сбор и сортировка ключей по протоколам
      run: |
        # Создаем временный файл для сбора всего мусора
        echo "" > temp_all.txt

        # Скачиваем мировые базы данных прокси
        curl -sSL -H "User-Agent: Mozilla/5.0" "https://githubusercontent.com" >> temp_all.txt || true
        curl -sSL -H "User-Agent: Mozilla/5.0" "https://githubusercontent.com" >> temp_all.txt || true
        curl -sSL -H "User-Agent: Mozilla/5.0" "https://githubusercontent.com" >> temp_all.txt || true
        curl -sSL -H "User-Agent: Mozilla/5.0" "https://githubusercontent.com" >> temp_all.txt || true
        curl -sSL -H "User-Agent: Mozilla/5.0" "https://githubusercontent.com" >> temp_all.txt || true
        curl -sSL -H "User-Agent: Mozilla/5.0" "https://githubusercontent.com" >> temp_all.txt || true

        # Сортируем ключи по отдельным файлам подписок (убираем дубликаты)
        grep -E '^vless://' temp_all.txt | sort -u > vless.txt || echo "" > vless.txt
        grep -E '^vmess://' temp_all.txt | sort -u > vmess.txt || echo "" > vmess.txt
        grep -E '^trojan://' temp_all.txt | sort -u > trojan.txt || echo "" > trojan.txt
        grep -E '^(shadowsocks|ss)://' temp_all.txt | sort -u > shadowsocks.txt || echo "" > shadowsocks.txt

        # Создаем общий микс-файл (как было раньше)
        grep -E '^(vless|vmess|shadowsocks|ss|trojan)://' temp_all.txt | sort -u > whitelist_subscription.txt
        
        # Удаляем временный файл
        rm temp_all.txt

    - name: Сохранение изменений в репозиторий
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        git add vless.txt vmess.txt trojan.txt shadowsocks.txt whitelist_subscription.txt
        git commit -m "Сортировка протоколов по отдельным файлам" || echo "Нет изменений"
        git push
