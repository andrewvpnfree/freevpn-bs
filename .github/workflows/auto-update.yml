name: Auto Update Whitelist Bypass

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run python sorter
      run: python update_bypass.py

    - name: Принудительный Push в репозиторий
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        git add vless.txt vmess.txt trojan.txt shadowsocks.txt whitelist_subscription.txt
        git commit -m "Финальное обновление файлов скриптом" || echo "Нет изменений"
        git push origin main
