name: Auto Update Whitelist Bypass

on:
  schedule:
    - cron: '0 */5 * * *' # Каждые 5 часов
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Прямое скачивание свежих VLESS конфигураций
      run: |
        curl -sSL -H "User-Agent: Mozilla/5.0" "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt" > whitelist_subscription.txt

    - name: Сохранение изменений в репозиторий
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        git add whitelist_subscription.txt
        git commit -m "Финальное автообновление подписки белых списков" || echo "Нет изменений"
        git push
