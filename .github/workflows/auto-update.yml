name: Auto Update Whitelist Bypass

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Шаг 1. Проверка вашего репозитория
      uses: actions/checkout@v4

    - name: Шаг 2. Внутреннее скачивание стабильной базы
      uses: actions/checkout@v4
      with:
        repository: 'zieng2/wl'
        path: 'source_repo'

    - name: Шаг 3. Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Шаг 4. Запуск умного мега-парсерa
      run: python update_bypass.py

    - name: Шаг 5. Сохранение результатов в файлы
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        git add vless.txt vmess.txt trojan.txt shadowsocks.txt whitelist_subscription.txt
        git commit -m "Автообновление из множества источников через Python" || echo "Нет изменений"
        git push origin main
